name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio-astro/package-lock.json

      - name: Install
        working-directory: portfolio-astro
        run: npm ci

      - name: Build Astro portfolio
        working-directory: portfolio-astro
        env:
          SITE_BASE: /AlgoritmoTiendas/
          SITE_URL: https://franciscorodalf.github.io
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio-astro/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
